[workspace]
members = ["crates/forge", "crates/view", "crates/rvt", "crates/ctx-core", "crates/ctx"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
unicode-width = "0.2.3"
forge = { path = "crates/forge" }
view = { path = "crates/view" }
ctx-core = { path = "crates/ctx-core" }
pulldown-cmark = { version = "0.13.6", default-features = false }
